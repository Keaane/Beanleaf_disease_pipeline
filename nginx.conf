events {}

http {
  # Docker's DNS gives one address per api container; nginx rotates between them.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    client_max_body_size 100m;

    location / {
      set $api http://api:8000;
      proxy_pass $api;
      proxy_read_timeout 300s;
    }
  }
}
