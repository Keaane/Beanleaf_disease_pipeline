# Render Blueprint: one Docker web service (free plan, 512 MB RAM).
services:
  - type: web
    name: bean-watch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # batch size 1 matches predictions, so retraining reuses the same graph and fits in 512 MB
      - key: RETRAIN_BATCH_SIZE
        value: "1"
      - key: RETRAIN_REPLAY_PER_CLASS
        value: "15"
      - key: RETRAIN_EPOCHS
        value: "3"
