# Run N API containers behind nginx:  docker compose up --build --scale api=2
# UI and API: http://localhost:8080
services:
  api:
    build: .
    environment:
      - OMP_NUM_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - TF_NUM_INTEROP_THREADS=1
      - BEAN_DB_PATH=/app/state/app_data.db
    volumes:
      - ./models:/app/models   # shared, so a retrained model reaches every container
      - ./state:/app/state     # shared SQLite database
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
